[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-research"
version = "0.1.0"
description = "Commodity research and analytics"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
"*" = [".gitkeep"]
"comm_research.markets.weather.vis" = ["conus_2024.json.gz", "europe_50m.json.gz", "natural_earth.json.gz"]
