[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-research"
version = "0.1.0"
description = "Commodity research and analytics"
requires-python = ">=3.10"
dependencies = ["polars>=1.0,<2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["comm_research*"]
