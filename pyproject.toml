[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-research"
version = "0.1.0"
description = "Commodity research and analytics"
requires-python = ">=3.10"
dependencies = ["polars>=1.0,<2"]

[project.optional-dependencies]
vis = ["plotly>=6,<7", "kaleido>=1,<2", "hvplot>=0.12,<1", "geoviews>=1.0,<2", "panel>=1.5,<2"]
dashboard = ["pyarrow>=14,<26", "duckdb>=1.2,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
# Both ERA5 readers use Zarr v2; newer xarray releases require the v3 Python API.
weather = ["cdsapi>=0.7.7,<1", "numpy>=1.26,<3", "xarray>=2024.10,<2026", "netCDF4>=1.7.2,<2", "zarr>=2.18,<3", "gcsfs>=2024.3,<2027"]
notebooks = ["ipykernel>=6,<8", "nbformat>=5,<6", "jupyter-bokeh>=4,<5"]

era5 = ["numpy>=1.26,<3", "pyarrow>=17,<26", "zarr>=2.18,<3", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["comm_research*"]

[tool.setuptools.package-data]
"comm_research.dashboard.ui" = ["*.html", "*.css", "*.js", "vendor/*", "styles/*", "src/*", "src/markets/power_gas/napg/caiso/*.js"]

"*" = [".gitkeep"]
