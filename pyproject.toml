[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-research"
version = "0.1.0"
description = "Commodity research and analytics"
requires-python = ">=3.10"
dependencies = ["polars>=1.0,<2"]

[project.optional-dependencies]
dashboard = ["pyarrow>=14,<26", "duckdb>=1.2,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
weather = ["cdsapi>=0.7.7,<1", "numpy>=1.26,<3", "xarray>=2024.1,<2027", "netCDF4>=1.7.2,<2"]
notebooks = ["ipykernel>=6,<8", "nbformat>=5,<6"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["comm_research*"]

[tool.setuptools.package-data]
"comm_research.dashboard.ui" = ["*.html", "*.css", "*.js", "vendor/*", "styles/*", "src/*", "src/markets/power_gas/napg/caiso/*.js"]

"*" = [".gitkeep"]
