[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-research"
version = "0.1.0"
description = "Commodity research and analytics"
requires-python = ">=3.10"
dependencies = ["polars>=1.0,<2"]

[project.optional-dependencies]
dashboard = ["pyarrow>=14,<26", "duckdb>=1.2,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
era5 = ["numpy>=1.26,<3", "pyarrow>=17,<26", "zarr>=2.18,<3", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["comm_research*"]

[tool.setuptools.package-data]
"comm_research.dashboard.ui" = ["*.html", "*.css", "*.js", "vendor/*", "styles/*", "src/*", "src/markets/power_gas/napg/caiso/*.js"]

"*" = [".gitkeep"]
