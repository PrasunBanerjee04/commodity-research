[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commodity-research"
version = "0.1.0"
description = "Commodity research and analytics"
requires-python = ">=3.10"
dependencies = ["polars>=1.0,<2"]

[project.optional-dependencies]
dashboard = ["pyarrow>=14,<26"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["comm_research*"]

[tool.setuptools.package-data]
"comm_research.dashboard.ui" = ["*.html", "*.css", "*.js", "vendor/*", "styles/*", "src/*"]
